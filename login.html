<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('unitop-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — UNITOP Payroll</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261021visibility6">
</head>
<body class="login-body">

<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <h1>UNITOP</h1>
            <div class="login-sub">Payroll System</div>
        </div>

        <div id="msg" class="msg hidden"></div>

        <form id="login-form">
            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required autofocus>
            </div>
            <div class="login-field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary login-btn" type="submit" id="login-btn">Log In</button>
        </form>

        <div class="login-footer">
            Payroll System — Admin Panel
        </div>
    </div>
</div>

<script src="assets/js/axios.min.js"></script>
<script src="assets/js/login.js"></script>
<button type="button" class="theme-toggle theme-toggle-fixed" data-theme-toggle>🌙 Dark</button>
<script src="assets/js/theme.js"></script>
</body>
</html>
