<nav class="sidebar">

        <div class="brand-logo">U</div>
        <div class="brand-text">
            <strong>UNITOP</strong>
            <small>Payroll System</small>
        </div>
    </div>

    <div class="sidebar-links">
        <a href="index.html" data-page="index.html">Dashboard</a>

        <div class="nav-section">Setup</div>
        <a href="departments.html" data-page="departments.html">Departments</a>
        <a href="positions.html" data-page="positions.html">Positions</a>
        <a href="employees.html" data-page="employees.html">Employees</a>
        <a href="users.html" data-page="users.html">Users</a>

        <div class="nav-section">Daily Logs</div>
        <a href="attendance.html" data-page="attendance.html">Attendance</a>
        <a href="leave.html" data-page="leave.html">Leave</a>
        <a href="overtime.html" data-page="overtime.html">Overtime</a>

        <a href="reports.html" data-page="reports.html">Reports</a>
    </div>

    <!-- api.js will append the user block here -->
</nav>
<div class="container">

    <h1>Payslips</h1>
    <p class="subtitle" id="subtitle">Loading…</p>

    <div id="msg" class="msg hidden"></div>

    <div class="card">
        <div class="toolbar">
            <strong id="record-count">0 record(s)</strong>
            <a href="payroll_runs.html" class="btn btn-plain">&larr; Back to Runs</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Employee</th>
                    <th style="text-align:right;">Gross</th>
                    <th style="text-align:right;">SSS</th>
                    <th style="text-align:right;">PhilHealth</th>
                    <th style="text-align:right;">Pag-IBIG</th>
                    <th style="text-align:right;">Tax</th>
                    <th style="text-align:right;">Total Ded.</th>
                    <th style="text-align:right;">Net Pay</th>
                    <th class="col-center">Actions</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr class="loading-row"><td colspan="9">Loading…</td></tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Payslip modal -->
<div id="payslip-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>
        <div id="modal-body">Loading…</div>
        <div class="modal-actions">
            <button class="btn btn-plain" id="modal-print">Print</button>
            <button class="btn btn-primary" id="modal-done">Close</button>
        </div>
    </div>
</div>

<script src="assets/js/axios.min.js"></script>
<script src="assets/js/sweetalert2.min.js"></script>
<script src="assets/js/dialogs.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/payslips.js"></script>
</body>
</html>
