<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('unitop-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — UNITOP Payroll</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261021visibility8">
</head>
<body class="login-body">

<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <h1>UNITOP</h1>
            <div class="login-sub">Payroll System</div>
        </div>

        <div id="forgot-msg" class="msg hidden"></div>

        <div id="forgot-form-wrap">
            <h2 class="auth-title">Forgot password</h2>
            <p class="auth-copy">
                Enter your username or email address. If an account matches,
                reset instructions will be sent.
            </p>

            <form id="forgot-form">
                <div class="login-field">
                    <label for="forgot-identity">Username or email</label>
                    <input type="text" id="forgot-identity" autocomplete="username" required autofocus>
                </div>
                <button class="btn btn-primary login-btn" type="submit">Send reset instructions</button>
            </form>

            <div class="demo-note">
                <strong>Demo only:</strong> no email is sent and no password is changed.
            </div>
        </div>

        <div class="login-footer">
            <a href="login.html" class="auth-link">Back to login</a>
        </div>
    </div>
</div>

<button type="button" class="theme-toggle theme-toggle-fixed" data-theme-toggle>🌙 Dark</button>
<script src="assets/js/theme.js"></script>
<script>
document.getElementById("forgot-form").addEventListener("submit", function (event) {
    event.preventDefault();

    var identity = document.getElementById("forgot-identity").value.trim();
    if (!identity) return;

    document.getElementById("forgot-form-wrap").classList.add("hidden");
    var message = document.getElementById("forgot-msg");
    message.className = "msg success";
    message.innerHTML = "<strong>Check your inbox.</strong> If an account matches <em>" +
        identity.replace(/[&<>'"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c];
        }) +
        "</em>, reset instructions have been sent. This is a demo, so no email was actually sent.";
    message.classList.remove("hidden");

    var footer = document.querySelector(".login-footer");
    footer.className = "login-footer auth-footer-actions";
    footer.innerHTML = '<a href="login.html" class="auth-link">Return to login</a>';
});
</script>
</body>
</html>
