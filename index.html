<div class="container">

    <h1>Dashboard</h1>
    <p class="subtitle">Live overview of your payroll system.</p>

    <div id="msg" class="msg hidden"></div>

    <!-- ROW 1 — KPI tiles -->
    <div id="kpi-grid" class="kpi-grid">
        <div class="kpi-tile"><div class="kpi-label">Loading…</div></div>
    </div>

    <!-- ROW 2 — Workflow cards -->
    <div id="workflow-grid" class="workflow-grid" style="margin-top:24px;">
        <div class="workflow-card"><div class="workflow-title">Loading…</div></div>
    </div>

    <!-- ROW 3 — Today's attendance -->
    <div class="dash-row" style="margin-top:24px;">
        <div class="card" id="attendance-snapshot">
            <div style="text-align:center;padding:20px;color:#888;">Loading…</div>
        </div>
    </div>

    <!-- ROW 4 — Recent runs -->
    <div class="card" style="margin-top:0;">
        <h3>Recent Payroll Runs</h3>
        <div id="recent-runs">
            <div style="text-align:center;padding:20px;color:#888;">Loading…</div>
        </div>
    </div>

</div>
