<div class="container">

    <h1>Attendance / Leave Ledger</h1>
    <p class="subtitle">Chronological record of attendance and leave per employee.</p>

    <div id="msg" class="msg hidden"></div>

    <div class="card">
        <form id="filter-form" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:1;min-width:260px;">
                <label style="display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:600;">Employee</label>
                <select id="employee_id" required style="width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:5px;font-size:13.5px;">
                    <option value="">-- Select an employee --</option>
                </select>
            </div>
            <div style="min-width:160px;">
                <label style="display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:600;">From</label>
                <input type="date" id="from_date" required
                       style="width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:5px;font-size:13.5px;">
            </div>
            <div style="min-width:160px;">
                <label style="display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:600;">To</label>
                <input type="date" id="to_date" required
                       style="width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:5px;font-size:13.5px;">
            </div>
            <button class="btn btn-primary" type="submit">Generate Ledger</button>
            <button class="btn btn-plain" type="button" id="print-btn" disabled>Print</button>
        </form>
    </div>

    <div class="card hidden" id="result-card">
        <div id="ledger-output"></div>
    </div>

</div>

<script src="assets/js/axios.min.js"></script>
